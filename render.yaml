services:
  - type: web
    name: company-brain
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FALKORDB_HOST
        value: r-6jissuruar.instance-megw6m809.hc-7up0crkyn.ap-south-1.aws.f2e0a955bb84.cloud
      - key: FALKORDB_PORT
        value: "63126"
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: FALKORDB_GRAPH_NAME
        value: company_brain
      - key: WORKSPACE_ID
        value: ws_company_prime
